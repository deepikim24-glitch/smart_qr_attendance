services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_qr_attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance_dev_only
      POSTGRES_DB: smart_qr_attendance
    ports:
      - "5432:5432"
    volumes:
      - smart_qr_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d smart_qr_attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smart_qr_pgdata:
